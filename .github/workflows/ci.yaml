
name: InterviewIQ CI Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:

  # ==========================
  # BACKEND CI
  # ==========================
  backend:
    name: Django Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: interviewiq_test
          POSTGRES_USER: interviewiq
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interviewiq -d interviewiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "ci-only-secret-key-not-for-production"
      DEBUG: "False"

      DB_NAME: interviewiq_test
      DB_USER: interviewiq
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-password
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: ci@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        working-directory: Backend
        run: python manage.py check

      - name: Run Django tests
        working-directory: Backend
        run: python manage.py test

  # ==========================
  # FRONTEND CI
  # ==========================
  frontend:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build React application
        working-directory: Frontend
        run: npm run build
